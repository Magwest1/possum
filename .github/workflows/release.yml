name: Release

# release-please keeps a release PR open on main. Merging it creates a *draft*
# GitHub release and tag; the macOS job then builds, signs with Developer ID,
# notarizes, staples, uploads the DMG + ZIP, and only then publishes the release.
# If signing fails (e.g. secrets not configured yet), the draft stays private.
#
# Manual runs: leave `tag` empty for a signed + notarized dry run of main that
# publishes nothing (the DMG/ZIP are attached to the run as an artifact), or
# pass an existing tag to rebuild and publish that release.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to rebuild and publish (e.g. v0.1.0). Leave empty for a dry run of main.
        required: false
        default: ''
        type: string

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: release

jobs:
  release-please:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  macos:
    needs: release-please
    if: >-
      always() &&
      (github.event_name == 'workflow_dispatch' ||
       (needs.release-please.result == 'success' && needs.release-please.outputs.release_created == 'true'))
    runs-on: macos-latest
    timeout-minutes: 60
    environment: release
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || needs.release-please.outputs.tag_name }}
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.tag == '' }}
    steps:
      - name: Validate tag
        if: env.DRY_RUN != 'true'
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.]+)?$ ]] || { echo "Invalid tag: $TAG" >&2; exit 1; }

      - uses: actions/checkout@v7
        with:
          ref: ${{ env.DRY_RUN == 'true' && github.sha || env.TAG }}
          fetch-depth: 0

      - name: Validate signing secrets
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          missing=0
          for name in MACOS_CERTIFICATE_P12 MACOS_CERTIFICATE_PASSWORD APPLE_API_KEY_P8 APPLE_API_KEY_ID APPLE_API_ISSUER; do
            if [ -z "${!name:-}" ]; then echo "::error::Secret $name is not set (see docs/RELEASING.md)"; missing=1; fi
          done
          exit $missing

      - name: Import Developer ID certificate into a temporary keychain
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/possum-signing.keychain-db"
          keychain_password="$(openssl rand -base64 32)"
          cert="$RUNNER_TEMP/possum-cert.p12"
          printf '%s' "$MACOS_CERTIFICATE_P12" | base64 --decode > "$cert"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$cert" -k "$keychain" -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          rm -f "$cert"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          identity="$(security find-identity -v -p codesigning "$keychain" | awk '/Developer ID Application/ { print $2; exit }')"
          test -n "$identity" || { echo "::error::No 'Developer ID Application' identity in MACOS_CERTIFICATE_P12"; exit 1; }
          echo "KEYCHAIN_PATH=$keychain" >> "$GITHUB_ENV"
          echo "SIGN_IDENTITY=$identity" >> "$GITHUB_ENV"

      - name: Prepare App Store Connect API key
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          set -euo pipefail
          key_path="$RUNNER_TEMP/possum-notary-key.p8"
          printf '%s' "$APPLE_API_KEY_P8" | base64 --decode > "$key_path"
          chmod 600 "$key_path"
          echo "APPLE_API_KEY_PATH=$key_path" >> "$GITHUB_ENV"

      - name: Build and sign
        run: scripts/build-app.sh

      - name: Verify Developer ID signature
        run: |
          set -euo pipefail
          app=build/Possum.app
          codesign --verify --deep --strict --verbose=2 "$app"
          codesign -dvv "$app" 2>&1 | grep -E '^(Authority|TeamIdentifier|Identifier|Runtime)'
          codesign -dvv "$app" 2>&1 | grep -q 'flags=.*runtime'

      - name: Create and sign DMG
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < version.txt)"
          dmg="build/Possum-$version.dmg"
          scripts/make-dmg.sh build/Possum.app "$dmg"
          codesign --force --timestamp --sign "$SIGN_IDENTITY" "$dmg"
          echo "DMG=$dmg" >> "$GITHUB_ENV"
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Notarize
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          set -euo pipefail
          auth=(--key "$APPLE_API_KEY_PATH" --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER")
          result="$(xcrun notarytool submit "$DMG" "${auth[@]}" --wait --timeout 40m --output-format json)"
          echo "$result"
          status="$(jq -r .status <<< "$result")"
          id="$(jq -r .id <<< "$result")"
          if [ "$status" != "Accepted" ]; then
            xcrun notarytool log "$id" "${auth[@]}" || true
            echo "::error::Notarization finished with status: $status"
            exit 1
          fi

      - name: Staple and verify
        run: |
          set -euo pipefail
          xcrun stapler staple "$DMG"
          xcrun stapler staple build/Possum.app
          xcrun stapler validate "$DMG"
          xcrun stapler validate build/Possum.app
          spctl --assess --type execute --verbose=4 build/Possum.app
          spctl --assess --type open --context context:primary-signature --verbose=4 "$DMG"

      - name: Package ZIP and checksums
        run: |
          set -euo pipefail
          zip="build/Possum-$VERSION.zip"
          ditto -c -k --sequesterRsrc --keepParent build/Possum.app "$zip"
          (cd build && shasum -a 256 "$(basename "$DMG")" "$(basename "$zip")" > SHA256SUMS.txt)
          echo "ZIP=$zip" >> "$GITHUB_ENV"
          cat build/SHA256SUMS.txt

      - name: Upload dry-run artifact
        if: env.DRY_RUN == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: possum-signed-dry-run-${{ github.run_id }}
          path: |
            ${{ env.DMG }}
            ${{ env.ZIP }}
            build/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7

      - name: Upload assets and publish release
        if: env.DRY_RUN != 'true'
        run: |
          set -euo pipefail
          gh release upload "$TAG" "$DMG" "$ZIP" build/SHA256SUMS.txt --clobber
          gh release edit "$TAG" --title "Possum $TAG" --draft=false --latest

      - name: Clean up signing material
        if: always()
        run: |
          rm -f "${APPLE_API_KEY_PATH:-}"
          if [ -n "${KEYCHAIN_PATH:-}" ]; then security delete-keychain "$KEYCHAIN_PATH" || true; fi
